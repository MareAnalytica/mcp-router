# .github/workflows/prod-tag.yml
# ─────────────────────────────────────────────────────────────
# Tag v* → build all images. ArgoCD deploys.
# ── PROJECT-SPECIFIC: edit the `with:` values below. ─────────
# ─────────────────────────────────────────────────────────────
name: Release → Prod

on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      # ┌──────────────────────────────────────────────────────┐
      # │  EDIT: same image list as dev-push.yml               │
      # └──────────────────────────────────────────────────────┘
      images: >-
        [
          { "name": "mcp-router-backend",  "context": "./backend",  "dockerfile": "./backend/Dockerfile" },
          { "name": "mcp-router-frontend", "context": "./frontend", "dockerfile": "./frontend/Dockerfile" }
        ]
    # The reusable workflow needs the Harbor push credentials; a called
    # workflow sees no caller secrets unless they are inherited.
    secrets: inherit
