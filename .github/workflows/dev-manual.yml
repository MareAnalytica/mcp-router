# .github/workflows/dev-manual.yml
# ─────────────────────────────────────────────────────────────
# Manually build any branch into the dev Harbor project. ArgoCD deploys.
# Trigger from: Actions tab → "Build Branch → Dev" → Run workflow → pick branch
# ─────────────────────────────────────────────────────────────
name: Build Branch → Dev

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      images: >-
        [
          { "name": "mcp-router-backend",  "context": "./backend",  "dockerfile": "./backend/Dockerfile" },
          { "name": "mcp-router-frontend", "context": "./frontend", "dockerfile": "./frontend/Dockerfile" }
        ]

