# kube/overlays/dev/kustomization.yaml
# Dev environment overlay — smaller resources, separate namespace
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-router-dev

resources:
  - ../../base

patches:
  # Override namespace name for dev
  - target:
      kind: Namespace
      name: mcp-router
    patch: |
      - op: replace
        path: /metadata/name
        value: mcp-router-dev

  # Override ingress host for dev.
  #
  # Dev services now live under dev.mareanalytica.com rather than carrying a
  # -dev suffix on the prod name, so dev and prod are told apart by domain.
  #
  # ingressClassName is forced to traefik here too. base/frontend.yaml still
  # says nginx, which was correct on the old cluster; this one runs Traefik and
  # has no nginx controller, so an Ingress asking for class nginx is picked up
  # by nothing and the host 404s at the edge. Traefik's IngressClass is marked
  # default, but a default only applies when an Ingress names no class at all -
  # an explicit nginx is still an explicit no.
  - target:
      kind: Ingress
      name: mcp-router
    patch: |
      - op: replace
        path: /spec/ingressClassName
        value: traefik
      - op: replace
        path: /spec/tls/0/hosts/0
        value: mcp-router.dev.mareanalytica.com
      - op: replace
        path: /spec/tls/0/secretName
        value: mcp-router-dev-tls
      - op: replace
        path: /spec/rules/0/host
        value: mcp-router.dev.mareanalytica.com

  # Reduce resources for dev
  - target:
      kind: Deployment
      name: backend
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                resources:
                  requests:
                    memory: "128Mi"
                    cpu: "50m"
                  limits:
                    memory: "512Mi"
                    cpu: "500m"

# ── THE BLOCK CI REWRITES ─────────────────────────────────────────────────────
# The dev-tag lane (.github/workflows/dev-tag.yml) rewrites this block by literal
# path: it matches `- name: <image>` exactly, then the first newTag:/digest: line
# under it. Keep the `- name:` lines byte-exact and give every entry a version
# line.
#
# Seeded with `newTag: latest`, which is a deliberate no-op - it is what the base
# already requests, so adding this block changed nothing. The first
# vX.Y.Z-dev.N tag replaces each line with the digest it just built, and from
# then on ArgoCD deploys a content-addressed image instead of a moving tag.
# The pin commit IS the deploy: a moving tag alone never makes ArgoCD sync.
images:
  - name: registry.mareanalytica.com/mare-dev/mcp-router-backend
    newTag: latest
  - name: registry.mareanalytica.com/mare-dev/mcp-router-frontend
    newTag: latest
